<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aura Music — Premium Audio & Discovery PWA</title>
    <meta name="description" content="Experience high-fidelity music playback, local audio management, YouTube discovery, offline storage, and synchronized lyrics in an installable Progressive Web App." />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Aura Music — Premium Audio & Discovery PWA" />
    <meta property="og:description" content="Experience high-fidelity music playback, local audio management, YouTube discovery, and offline storage." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura Music — Premium Audio & Discovery PWA" />
    <meta name="twitter:description" content="A visually exceptional, Spotify-class music web application." />
    <meta name="twitter:image" content="/pwa-512x512.png" />

    <!-- PWA & Mobile Web App Capabilities -->
    <meta name="theme-color" content="#151515" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura Music" />
    
    <!-- Icons & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Preconnect & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#151515] text-[#F1EEE7] antialiased selection:bg-[#C7B5FF]/20 selection:text-[#F1EEE7] overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then((reg) => {
              console.log('[Aura PWA] Service Worker registered with scope:', reg.scope);
            })
            .catch((err) => {
              console.warn('[Aura PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
